name: refresh-workworkdo

on:
  schedule:
    # Runs 4x daily, each run pushes multiple commits
    # -> ~12 commits/day solid dark-green contribution graph.
    - cron: "17 3,8,13,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch commits and rebuild dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_DASH_TOKEN }}
          TARGET_REPO: ykr0p/ykr0p-new_arch_workdo_w
          RADAR_AUTHOR_NAME: glcskl
          RADAR_AUTHOR_EMAIL: 188385208+glcskl@users.noreply.github.com
        run: python3 scripts/fetch_commits.py

      - name: Record 3 commits per run
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_DASH_TOKEN }}
        run: |
          git config user.name "glcskl"
          git config user.email "188385208+glcskl@users.noreply.github.com"
          DAY=$(date -u +%Y-%m-%d)
          VARIANTS=(
            "chore(workworkdo): refresh activity snapshot"
            "chore(workworkdo): rebuild commit dashboard"
            "chore(workworkdo): update feed cache"
            "chore(workworkdo): sync remote snapshot"
            "chore(workworkdo): regenerate daily grid"
            "chore(workworkdo): bump workdo radar"
            "chore(workworkdo): refresh metadata"
            "chore(workworkdo): update dashboard assets"
          )
          VARIANTSLEN=${#VARIANTS[@]}
          for i in 1 2 3; do
            IDX=$(( ( $(date -u +%s) / 60 + i ) % VARIANTSLEN ))
            MSG="${VARIANTS[$IDX]}"
            RUN_ID="$DAY-$i-$(date -u +%H%M)" python3 scripts/update_history.py 1.0 "$MSG"
            git add -A
            git commit -q -m "$MSG"
          done

      - name: Push
        run: |
          git pull --rebase --autostash
          git push