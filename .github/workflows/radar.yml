name: refresh-radar

on:
  schedule:
    # Runs daily. The commit probability below produces a natural,
    # mostly-green (not uniform) contribution graph.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch commits and rebuild dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_DASH_TOKEN }}
          TARGET_REPO: ykr0p/ykr0p-new_arch_workdo_w
          RADAR_AUTHOR_NAME: glcskl
          RADAR_AUTHOR_EMAIL: 188385208+glcskl@users.noreply.github.com
        run: python3 scripts/fetch_commits.py

      - name: Record an activity entry (stochastic, mostly green)
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_DASH_TOKEN }}
        run: |
          DAY=$(date -u +%Y-%m-%d)
          # Deterministic-but-natural skip: ~18% of days produce no entry.
          P=$(( ( ( $(date -u +%Y) * 372 ) + ( $(date -u +%m) * 31 ) + $(date -u +%d) ) % 100 ))
          if [ "$P" -lt 82 ]; then
            VARIANTS=(
              "chore(radar): refresh activity snapshot"
              "chore(radar): rebuild commit dashboard"
              "chore(radar): update feed cache"
              "chore(radar): sync remote snapshot"
              "chore(radar): regenerate daily grid"
            )
            VARIANTSLEN=${#VARIANTS[@]}
            IDX=$(( ( $(date -u +%H) + $(date -u +%M) ) % VARIANTSLEN ))
            MSG="${VARIANTS[$IDX]}"
            RUN_ID="$DAY-$P" python3 scripts/update_history.py 1.0 "$MSG"
          else
            echo "skip entry for $DAY (deterministic gap day)"
          fi

      - name: Commit and push
        run: |
          git config user.name "glcskl"
          git config user.email "188385208+glcskl@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(radar): refresh daily snapshot [$(date -u +%F)]"
            git pull --rebase --autostash
            git push
          else
            echo "no changes; nothing to push"
          fi
