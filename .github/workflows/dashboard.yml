name: dashboard

on:
  schedule:
    - cron: "17 3,8,13,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar
          persist-credentials: true
          fetch-depth: 0

      - name: Rebuild dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_DASH_TOKEN }}
          TARGET_REPO: ykr0p/ykr0p-new_arch_workdo_w
          RADAR_AUTHOR_NAME: glcskl
          RADAR_AUTHOR_EMAIL: 188385208+glcskl@users.noreply.github.com
        run: python3 scripts/fetch_commits.py

      - name: Record activity
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_DASH_TOKEN }}
        run: |
          git config user.name "glcskl"
          git config user.email "188385208+glcskl@users.noreply.github.com"
          DAY=$(date -u +%Y-%m-%d)
          VARIANTS=(
            "chore: refresh activity snapshot"
            "chore: rebuild dashboard"
            "chore: update feed cache"
            "chore: sync remote snapshot"
            "chore: regenerate daily grid"
            "chore: bump radar"
            "chore: refresh metadata"
            "chore: update dashboard assets"
          )
          N=${#VARIANTS[@]}
          for i in 1 2 3; do
            IDX=$(( ( $(date -u +%s) / 60 + i ) % N ))
            MSG="${VARIANTS[$IDX]}"
            RUN_ID="$DAY-$i-$(date -u +%H%M)" python3 scripts/update_history.py 1.0 "$MSG"
            git add -A
            git commit -q -m "$MSG"
          done

      - name: Push
        run: |
          git pull --rebase --autostash origin radar
          git push origin radar
